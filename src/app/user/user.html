<mat-card>
    <mat-card-content>
        <table class="user-table">
            <tr>
                <th>name</th>
                <th>E-Mail</th>
                <th>City</th>
            </tr>
            @for (user of allUsers; track $index) {
            <tr [routerLink]="'/user/' + user.id">
                <td>{{user.firstName}} {{user.lastName}}</td>
                <td>{{user.email}}</td>
                <td>{{user.city}}</td>
            </tr>
            }
        </table>
    </mat-card-content>
    <mat-card-content></mat-card-content>
</mat-card>

<button (click)="openDialog()" color="primary" matFab class="add-user-btn" matTooltip="add user"
    matTooltipPosition="above">
    <mat-icon>add</mat-icon>
</button>
