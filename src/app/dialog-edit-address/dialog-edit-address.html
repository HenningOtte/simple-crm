@if (loading) {<mat-progress-bar mode="indeterminate"></mat-progress-bar>}

<h1 mat-dialog-title>Edit Address</h1>
<mat-dialog-content>
    <form class="example-form">
        <div>
            <mat-form-field class="mt-8 full-width" appearance="outline">
                <mat-label>Street + House No.</mat-label>
                <input [disabled]="loading" [(ngModel)]="user.street" matInput placeholder="Placeholder" name="street">
            </mat-form-field>
        </div>
        <div>
            <mat-form-field class="mr-16" appearance="outline">
                <mat-label>Zip Code</mat-label>
                <input [disabled]="loading" [(ngModel)]="user.zipCode" matInput placeholder="Placeholder"
                    name="zipCode">
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>City</mat-label>
                <input [disabled]="loading" [(ngModel)]="user.city" matInput placeholder="Placeholder" name="city">
            </mat-form-field>
        </div>
    </form>
</mat-dialog-content>
<mat-dialog-actions>
    <button (click)="closeDialog()" [disabled]="loading" matButton>Cancel</button>
    <button [disabled]="loading" matButton (click)="saveUser()" [mat-dialog-close]="" cdkFocusInitial>Save</button>
</mat-dialog-actions>
