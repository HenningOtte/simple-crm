<mat-card class="user-detail-header">
    <button class="edit-user" matIconButton [matMenuTriggerFor]="userMenu">
        <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu" xPosition="before">
        <button (click)="editUserDetail()" mat-menu-item>Edit</button>
    </mat-menu>
    <div class="user-detail">
        <img class="profil-pic" src="/imgs/profile.png" alt="">
        <div class="user-info">
            <h2>{{singelUser.firstName}}</h2>
            <span>{{singelUser.email}}</span>
        </div>
    </div>
</mat-card>
@if (singelUser.city.length > 0) {
<mat-card class="address-container mt-32">
    <button class="edit-user" matIconButton [matMenuTriggerFor]="adressMenu">
        <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #adressMenu="matMenu" xPosition="before">
        <button (click)="editMenu()" mat-menu-item>Edit</button>
    </mat-menu>

    <mat-card-header>
        <mat-card-title>Address</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <span>{{singelUser.street}}</span><br>
        <span>{{singelUser.city}} {{singelUser.zipCode}}</span>
    </mat-card-content>
</mat-card>
}
